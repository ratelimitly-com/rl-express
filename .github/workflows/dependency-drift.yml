name: dependency drift

on:
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-drift
  cancel-in-progress: true

jobs:
  drift-test:
    name: dependency drift test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: rl-express

      - name: Set up Node.js latest
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: rl-express
        run: npm install --no-save --package-lock=false ratelimitly-client@latest

      - name: Run tests
        working-directory: rl-express
        run: npm test
